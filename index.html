    <!-- ── Pré-splash statique (avant que React ne charge) ─────────────────
         Évite le flash blanc au lancement : ce bloc s'affiche dès le tout
         premier paint du navigateur, avec le thème déjà résolu (lu en
         synchrone depuis localStorage), puis s'efface tout seul dès que
         React a pris le relais (voir le script juste après le <body>). -->
    <style>
      html,
      body {
        margin: 0;
        background: #f8fafc;
      }
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
      }
      #initial-splash img {
        width: 12rem;
        max-width: 55vw;
        user-select: none;
        -webkit-user-drag: none;
        animation: gregoSplashHeartbeat 1.1s ease-in-out infinite;
      }
      @keyframes gregoSplashHeartbeat {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.92);
          opacity: 0.6;
        }
      }
    </style>
  </head>

  <body>
    <!-- CONTENU SEMANTIQUE DE SECOURS POUR LES ROBOTS DE GOOGLE -->
    <noscript>
      <main>
        <h1>GreGo - Votre application de transport à Grenoble</h1>
        <p>
          GreGo permet de suivre en temps-réel les transports en commun MRESO
          TAG : recherche d'itinéraires, infos, carte interactive, suivi en
          direct, et bien plus de fonctionnalités.
        </p>
        <p>
          Optimisez vos déplacements quotidiens à Grenoble, Échirolles,
          Saint-Martin-d'Hères, Fontaine, Sassenage, Saint-Egrève et Meylan
          grâce à notre planificateur d'itinéraires rapide.
        </p>
      </main>
    </noscript>

    <div id="initial-splash">
      <img src="/logos/light_no_bg_banner.png" alt="" />
    </div>
    <script>
      (function () {
        try {
          var THEMES = ["light", "dark", "gray", "auto"];
          var raw = localStorage.getItem("tag-express-settings");
          var stored = raw ? JSON.parse(raw) : {};
          var theme =
            THEMES.indexOf(stored.theme) !== -1 ? stored.theme : "auto";

          if (theme === "auto") {
            var prefersDark =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches;
            theme = prefersDark ? "gray" : "light";
          }

          var bg =
            { light: "#F8FAFC", dark: "#0F172A", gray: "#1E1E1E" }[theme] ||
            "#F8FAFC";
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute("content", bg);
          var appleStatusBar = document.querySelector(
            'meta[name="apple-mobile-web-app-status-bar-style"]',
          );
          if (appleStatusBar)
            appleStatusBar.setAttribute(
              "content",
              theme === "light" ? "default" : "black",
            );
          var logo =
            theme === "light"
              ? "/logos/light_no_bg_banner.png"
              : "/logos/dark_no_bg_banner.png";

          var splash = document.getElementById("initial-splash");
          if (splash) {
            splash.style.backgroundColor = bg;
            var img = splash.querySelector("img");
            if (img) img.src = logo;
          }
        } catch (e) {}
      })();
    </script>

    <div id="root"></div>
    <script>
      // Retire le pré-splash dès que React a pris le relais (dès qu'il a
      // rendu quelque chose dans #root) — la propre SplashScreen React
      // (mêmes visuels) prend alors le relais sans coupure visible, puis
      // se masque elle-même une fois les données prêtes.
      (function () {
        var root = document.getElementById("root");
        var splash = document.getElementById("initial-splash");
        if (!root || !splash) return;
        var observer = new MutationObserver(function () {
          if (root.childNodes.length > 0) {
            splash.remove();
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
